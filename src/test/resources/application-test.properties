# --- Database (H2 in-memory for tests) ---
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Required by application.properties templates
DB_HOST=localhost
DB_PORT=5432
DB_NAME=testdb
DB_USER=sa
DB_PASSWORD=

# --- JWT ---
security.jwt.secret-key=test-secret-key-long-enough-for-hmac-sha256-algorithm
security.jwt.issuer=TestIssuer
JWT_SECRET=test-secret-key-long-enough-for-hmac-sha256-algorithm
JWT_ISSUER=TestIssuer

# --- Frontend ---
frontend_url=http://localhost:3000

# --- Mail (disabled in tests, MailVerifier will just log a warning) ---
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
spring.mail.password=test
spring.mail.properties.mail.debug=false
EMAIL_HOST=localhost
EMAIL_PORT=25
EMAIL_LOGIN=test@test.com
EMAIL_PASSWORD=test

# --- AWS S3 (fake credentials — no real calls at startup) ---
aws.access-key=test-access-key
aws.secret-key=test-secret-key
aws.region=eu-central-1
aws.s3.bucket=test-bucket
AWS_ACCESS_KEY_ID=test-access-key
AWS_SECRET_ACCESS_KEY=test-secret-key
AWS_REGION=eu-central-1
AWS_S3_BUCKET=test-bucket

# --- Actuator ---
management.endpoints.web.exposure.include=health
